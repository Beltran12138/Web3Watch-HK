name: Intel · SFC Register Snapshot

# SFC 公共登记册每日全量快照 + 与上一份比对 → intel-data 分支的 sfc/
# 约 3,700 家 × 2 页，4 线程约 1.5 小时。代码在 intel/，说明见 intel/README.md。
on:
  schedule:
    - cron: '0 16 * * *' # 每天 16:00 UTC = 香港 00:00
  workflow_dispatch:

concurrency:
  group: intel-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: intel-data
          path: data
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intel/requirements.txt
      - run: pip install -r intel/requirements.txt
      - name: Snapshot + diff
        env:
          INTEL_DATA: data
        run: python intel/sfc_snapshot.py run
      - name: Commit to intel-data
        working-directory: data
        run: |
          git config user.name "intel-bot"
          git config user.email "intel-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -q -m "sfc: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git push -q origin intel-data && exit 0; git pull -q --rebase origin intel-data; done
          exit 1
