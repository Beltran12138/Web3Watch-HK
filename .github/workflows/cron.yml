name: Alpha Radar Cron Jobs

on:
  # 已禁用自动触发 — 功能已拆分到 scrape_high.yml / scrape.yml / daily_report.yml / weekly_report.yml
  # 保留 workflow_dispatch 供手动触发调试使用
  workflow_dispatch:
    inputs:
      schedule:
        description: '模拟的调度类型 (high/low/health/daily/weekly)'
        required: false
        default: 'high'

jobs:
  scrape-high:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run high-frequency scrape
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: ${{ secrets.USE_SUPABASE || 'false' }}
        run: npm run scrape:high

  scrape-low:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/30 * * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run low-frequency scrape
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: ${{ secrets.USE_SUPABASE || 'false' }}
        run: npm run scrape:low

  health-check:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 * * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run health check
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node -e "const {sourceHealthMonitor} = require('./monitoring/source-health'); sourceHealthMonitor.checkHealthAndAlert()"

  daily-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run daily report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run daily-report

  weekly-report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 * * 5'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run weekly report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run weekly-report

  notion-sync:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */6 * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Sync to Notion
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: 'true'
        # 以前直接 db.prepare 查 SQLite —— runner 上的 SQLite 每轮都是空库，永远同步 0 条；改读 Supabase
        run: |
          node -e "const {notionIntegration} = require('./integrations/notion'); const {getNewsInRange} = require('./db'); getNewsInRange({since: Date.now() - 6*60*60*1000, minScore: 85, limit: 20}).then(items => notionIntegration.syncBatch(items, {minScore: 85})).then(r => console.log(r)).catch(e => { console.error(e); process.exit(1); })"

  github-export:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 16 * * *'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Export to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USE_SUPABASE: 'true'
        # 以前直接 db.prepare 查 SQLite（每轮空库）；改读 Supabase
        run: |
          node -e "const {githubIntegration} = require('./integrations/github'); const {getNewsInRange} = require('./db'); const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1); const dateStr = yesterday.toISOString().split('T')[0]; const start = new Date(dateStr).getTime(); const end = start + 86400000; getNewsInRange({since: start, until: end, orderBy: 'alpha_score'}).then(items => githubIntegration.exportDailyToRelease(items, dateStr)).then(r => console.log(r)).catch(e => { console.error(e); process.exit(1); })"
