name: Weekly Report

on:
  workflow_dispatch: # 仅手动触发（周报改为人工撰写后手动发送邮件）

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 不再编译 better-sqlite3：db.js 在 GitHub Actions 上不打开 SQLite，读写全走 Supabase
      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run Weekly Report
        run: node run_weekly_report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          USE_SUPABASE: true
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WEEKLY_EMAIL_TO: ${{ secrets.WEEKLY_EMAIL_TO }}
