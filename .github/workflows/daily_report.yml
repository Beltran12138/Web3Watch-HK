name: Daily Report

on:
  schedule:
    # 每天北京时间 18:00 (= UTC 10:00)
    # 注意：GitHub Actions cron 可能延迟 5-30 分钟
    - cron: '0 10 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

# 防止多个日报实例并发运行
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Skip if already ran today
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # 这一步只是去重闸，但它失败会连带跳过整天的日报：shell 是 bash -e，
          # gh run list 非零退出就直接 exit 1，needs.check 失败后 daily-report 任务被 skip。
          # 2026-11-13 就是这么丢了一期：gh 撞上 HTTP 503，当天 18:00 的日报没发，
          # 守护器想补发又没有 actions:write（见 report_guardian.yml）。
          # 现在重试三次；三次都拿不到答案就按「今天还没发」放行 —— 宁可重发也不要漏发。
          RUNS=""
          for i in 1 2 3; do
            RUNS=$(gh run list \
              --workflow=daily_report.yml \
              --repo "$GITHUB_REPOSITORY" \
              --json createdAt,conclusion \
              --jq "[.[] | select(.createdAt | startswith(\"$TODAY\")) | select(.conclusion == \"success\")] | length") && break
            echo "[Check] gh run list attempt $i failed."
            RUNS=""
            if [ "$i" -lt 3 ]; then sleep 10; fi
          done
          if [ -z "$RUNS" ]; then
            echo "[Check] Cannot read run history (GitHub API failed 3x). Assuming not run yet."
            RUNS=0
          fi
          echo "Successful runs today: $RUNS"
          if [ "$RUNS" -gt "0" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "[Check] Daily report already ran successfully today. Skipping."
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[Check] No successful run today. Proceeding."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  daily-report:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 不再编译 better-sqlite3：db.js 在 GitHub Actions 上不打开 SQLite，读写全走 Supabase
      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run Daily Report
        id: report
        run: node run_daily_report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          USE_SUPABASE: 'true'
          DEBUG: 'true'

      - name: Retry on failure
        if: failure()
        run: |
          echo "[Retry] First attempt failed, retrying in 30s..."
          sleep 30
          node run_daily_report.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          USE_SUPABASE: 'true'
          DEBUG: 'true'

      - name: Generate GitHub Pages
        if: success()
        run: node generate-pages.js --days=30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Generate Wiki
        if: success()
        run: node generate-wiki.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Commit & push Pages + Wiki
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ wiki/
          git diff --staged --quiet || git commit -m "chore: update Pages + wiki [$(date -u +%Y-%m-%d)]"
          git push || true
